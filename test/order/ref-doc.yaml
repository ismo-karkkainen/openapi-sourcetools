---
# Test $ref special handling
paths:
  /users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    - name: include
      in: query
      schema:
        type: string
    get:
      responses:
        "200":
          $ref: '#/components/responses/UserResponse'
        "404":
          description: Not found
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
